# sops-nix configuration
# This file defines which age keys can decrypt which secrets

keys:
  # Admin key (can decrypt everything)
  - &admin age10dggc9ndceshqs7zhljzjn72zch3ft9z3p0ynzfdvt5hd03l7pesvm3yp8

  # Host keys (derived from SSH host keys)
  - &mischief age1pldnhgr34hn375eufrrzlsv69qzwzjea3qhszlqkf73au0ruzflqp9yl9l
  - &vigilant age1k4zeq88vcrglaa2tedw3nuz2l5ny8j2l4xms3ukqt4knch4gheks423mcq
  - &intrepid age1v6n4fj0xfmyuzsvxyfv87frrr8p2p7ntjchc29p09zs5pjuqxc4qs3kcdd

creation_rules:
  # SSH keys for mischief - decryptable by admin and mischief
  - path_regex: ssh/mischief\.yaml$
    key_groups:
      - age:
          - *admin
          - *mischief

  # Syncthing identity for mischief
  - path_regex: syncthing/mischief\.yaml$
    key_groups:
      - age:
          - *admin
          - *mischief

  # SSH keys for intrepid
  - path_regex: ssh/intrepid\.yaml$
    key_groups:
      - age:
          - *admin
          - *intrepid

  # Syncthing identity for intrepid
  - path_regex: syncthing/intrepid\.yaml$
    key_groups:
      - age:
          - *admin
          - *intrepid

  # Vigilant SSH and Syncthing secrets
  - path_regex: ssh/vigilant\.yaml$
    key_groups:
      - age:
          - *admin
          - *vigilant

  - path_regex: syncthing/vigilant\.yaml$
    key_groups:
      - age:
          - *admin
          - *vigilant
